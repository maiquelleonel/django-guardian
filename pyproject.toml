[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "django-guardian"
version = "0.1.0"
description = "Architectural watchdog, custom system checks, and AI safety guardrails for Django projects."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    { name = "Maiquel", email = "maiquel@example.com" }
]
dependencies = [
    "Django>=4.2",
]

[project.optional-dependencies]
dev = [
    "django-ai-boost>=0.8.0",
    "ruff>=0.3.0",
]

[tool.hatch.build.targets.wheel]
packages = ["django_guardian"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "C90"]
mccabe = { max-complexity = 10 }
